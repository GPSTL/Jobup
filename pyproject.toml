[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "jobup.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--cov=jobup --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py314"
extend-exclude = ["migrations", ".venn", ".vevn"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["jobup"]
omit = ["jobup/migrations/*", "jobup/asgi.py", "jobup/wsgi.py", "jobup/tests.py"]
